appId: com.xieyuheng.windbell
productName: windbell
executableName: windbell
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

directories:
  output: release

files:
  - dist/main.mjs
  - package.json

extraResources:
  - from: ../windbell-web.js/dist
    to: web

asar: true
npmRebuild: false

linux:
  target:
    - AppImage
  category: Utility
  maintainer: xieyuheng

mac:
  target:
    - dmg

win:
  target:
    - nsis
    - portable
    - zip

nsis:
  # electron-builder picks the install directory name as follows:
  #
  #   APP_FILENAME = getWindowsInstallationDirName(appInfo, !oneClick || isPerMachine)
  #
  # With the default oneClick installer that flag is false, so it falls back to
  # appInfo.sanitizedName -- the npm package name with "/" stripped, i.e.
  # "@windbellwindbell-desktop.js". Setting oneClick to false makes it use
  # appInfo.productFilename instead, so the app lands in
  # %LOCALAPPDATA%\Programs\windbell.
  oneClick: false
  perMachine: false
  artifactName: "${productName}-${version}-${os}-${arch}-setup.${ext}"

portable:
  artifactName: "${productName}-${version}-${os}-${arch}-portable.${ext}"
